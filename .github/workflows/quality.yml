name: quality
# The quality bar, verified in CI rather than by hand:
#   * pytest (unit + migration test against a throwaway Postgres);
#   * Lighthouse mobile >= 90 on performance, accessibility, SEO and best
#     practices, zero console errors, no layout shift — on the HQ views and
#     the public doors;
#   * Playwright stranger e2e on the same pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: startend_migration_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/startend_migration_test

  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright + Lighthouse
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the HQ views against the canon stand-in
        run: |
          python3 ci/stub_canon.py 8765 &
          sleep 1
          mkdir -p srv
          SRV_DIR=srv CANON_RW_URL=http://127.0.0.1:8765/ BUS_STATE_URL=http://127.0.0.1:8765/bus \
            python3 boot/views_boot.py
          (cd srv && python3 -m http.server 8098 --bind 127.0.0.1 &)

      - name: Lighthouse gate (mobile, >= 90, no CLS, no console errors)
        run: |
          python3 ci/lighthouse.py \
            http://127.0.0.1:8098/ptf-k4x9m2.html

      - name: Stranger e2e (Playwright, mobile + desktop)
        working-directory: e2e
        run: npx playwright test
        env:
          SRV_BASE: http://127.0.0.1:8098
          APP_BASE: http://127.0.0.1:8000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            ci/out
            e2e/test-results
          if-no-files-found: ignore
