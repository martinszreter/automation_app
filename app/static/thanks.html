<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARTEND — Thank you</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M16 0H64V48H48V64H0V16H16Z' fill='%23DA291C'/%3E%3Crect x='26' y='12' width='12' height='40' fill='%23fff'/%3E%3Crect x='12' y='26' width='40' height='12' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{--black:#0B0B0C;--platinum:#ECE8DF;--grey:#8E8B84;--swiss:#DA291C}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--black);color:var(--platinum);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-weight:300;font-size:16.5px;line-height:1.7;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
  }
  main{max-width:56ch;text-align:center}
  h1{font-family:'Didot','Bodoni MT','Didot LT STD',Georgia,'Times New Roman',serif;
     font-weight:400;font-size:clamp(28px,5vw,44px);margin-bottom:18px}
  a{color:var(--platinum)}
  a.back{display:inline-block;margin-top:34px;padding:15px 30px;font-size:12px;font-weight:600;
    letter-spacing:.22em;text-transform:uppercase;text-decoration:none;
    border:1px solid var(--platinum);transition:background .2s,color .2s}
  a.back:hover{background:var(--platinum);color:var(--black)}
  ::selection{background:var(--swiss);color:#fff}
</style>
</head>
<body>
<main>
  <h1>Thank you — we reply within one business day.</h1>
  <a class="back" href="/">Back to startend.ch</a>
</main>
</body>
</html>
