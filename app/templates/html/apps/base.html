<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}WhatsApp-Reservierung einrichten{% endblock %} · startend.ch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M16 0H64V48H48V64H0V16H16Z' fill='%23DA291C'/%3E%3Crect x='26' y='12' width='12' height='40' fill='%23fff'/%3E%3Crect x='12' y='26' width='40' height='12' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EEF0EC; --card:#F7F8F5; --ink:#14181A; --ink-soft:#4A5250; --rule:#C9CDC6; --red:#E03123; --green:#1E7A46; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .mono{font-family:'IBM Plex Mono',monospace}
  .wrap{max-width:680px;margin:0 auto;padding:0 24px}
  header{border-bottom:1px solid var(--rule)}
  .head-in{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:12px}
  .wordmark{font-weight:800;letter-spacing:-0.02em;font-size:18px;text-decoration:none;color:var(--ink);display:flex;align-items:center}
  .wordmark span{color:var(--red)}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;color:var(--green)}
  h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-0.03em;line-height:1.05;margin:40px 0 12px}
  .sub{color:var(--ink-soft);margin-bottom:28px}
  .card{border:1.5px solid var(--ink);border-radius:2px;background:var(--card);padding:28px;margin-bottom:20px}
  label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
  .hint{color:var(--ink-soft);font-size:14px;margin-top:6px}
  .field{margin-bottom:22px}
  input[type=text],input[type=tel],textarea{
    width:100%;padding:13px 12px;border:1px solid var(--rule);border-radius:2px;background:#fff;
    font-family:'Archivo',sans-serif;font-size:16px;color:var(--ink)
  }
  textarea{min-height:104px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--red);outline-offset:1px;border-color:var(--red)}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:2px;font-weight:700;font-size:16px;border:1.5px solid var(--red);background:var(--red);color:#fff;cursor:pointer;font-family:'Archivo',sans-serif;text-decoration:none}
  .btn:hover{background:#C42417;border-color:#C42417}
  .err{border:1.5px solid var(--red);color:var(--red);padding:12px 14px;margin-bottom:20px;border-radius:2px;font-size:15px}
  .ref{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);letter-spacing:0.04em}
  footer{border-top:1px solid var(--rule);padding:24px 0 40px;font-size:13px;color:var(--ink-soft);margin-top:40px}
  footer a{color:var(--ink-soft)}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="wrap head-in">
    <a class="wordmark" href="/apps/"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true" style="margin-right:8px"><path d="M16 0H64V48H48V64H0V16H16Z" fill="#DA291C"/><rect x="26" y="12" width="12" height="40" fill="#fff"/><rect x="12" y="26" width="40" height="12" fill="#fff"/></svg>startend<span>.ch</span></a>
    {% block header_meta %}{% endblock %}
  </div>
</header>
<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>
<footer>
  <div class="wrap">
    STARTEND GmbH · CHE-223.488.613 · Bahnhofstrasse 7 · 6330 Cham ·
    <a href="/impressum/">Impressum</a> · <a href="mailto:info@startend.ch">info@startend.ch</a>
  </div>
</footer>
</body>
</html>
