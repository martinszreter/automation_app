<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ t.BRAND }}{% endblock %}</title>
<meta name="description" content="{% block description %}ORIGICAST — kuratierte Abende für Erwachsene ab 21. CHF 1 Test: einmal bezahlen, sofort zurück.{% endblock %}">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230B0B0C'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23C9A961' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23C9A961'/%3E%3C/svg%3E">
<style>
  /* Dark luxury, system fonts only: no external requests, nothing to wait for. */
  :root{--bg:#0B0B0C;--bg-2:#141416;--ink:#F3EFE6;--ink-soft:#B9B2A3;--line:#2A2A2E;--gold:#C9A961;--gold-2:#E2C889}
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .display{font-family:Georgia,'Times New Roman',Times,serif;font-weight:400;letter-spacing:.01em}
  .wrap{width:100%;max-width:720px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line)}
  .head-in{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:12px}
  .wordmark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-size:14px;letter-spacing:.34em;text-transform:uppercase}
  .wordmark svg{flex:none}
  .age{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:5px 9px;white-space:nowrap}
  main{flex:1 1 auto}
  .kicker{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
  h1{font-size:clamp(34px,8vw,56px);line-height:1.05;margin-bottom:18px;color:var(--ink)}
  .lead{color:var(--ink-soft);font-size:18px;max-width:52ch}
  .hero{padding:56px 0 40px}
  .card{border:1px solid var(--line);background:var(--bg-2);padding:26px 22px;margin:28px 0}
  .card h2{font-size:clamp(24px,5vw,32px);line-height:1.15;margin:8px 0 12px}
  .price{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin:18px 0 6px}
  .price b{font-size:40px;font-weight:400;color:var(--gold-2)}
  .price small{color:var(--ink-soft);font-size:14px}
  .btn{display:inline-block;padding:16px 30px;background:var(--gold);color:#0B0B0C;text-decoration:none;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--gold);cursor:pointer;font-family:inherit;text-align:center;min-height:52px}
  .btn:hover{background:var(--gold-2);border-color:var(--gold-2)}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--ink-soft);background:transparent}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  .btn-row .btn{flex:1 1 200px}
  .note{color:var(--ink-soft);font-size:14px;margin-top:14px}
  .err{border:1px solid var(--gold);color:var(--gold-2);padding:12px 14px;margin:0 0 20px;font-size:15px}
  .offers{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
  .offer{border:1px solid var(--line);padding:20px;background:var(--bg-2)}
  .offer h3{font-size:22px;margin-bottom:4px}
  .offer p{color:var(--ink-soft);font-size:15px}
  .offer .soon{display:inline-block;margin-top:10px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
  .ref{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.04em;overflow-wrap:anywhere}
  footer{border-top:1px solid var(--line);padding:22px 0 36px;font-size:13px;color:var(--ink-soft);margin-top:40px}
  footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  footer a:hover{border-bottom-color:var(--gold)}
  footer .legal{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:8px}
  :focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
  @media (min-width:640px){ .offers{grid-template-columns:repeat(3,1fr)} .hero{padding:80px 0 48px} .card{padding:34px 32px} }
</style>
</head>
<body>
<header>
  <div class="wrap head-in">
    <a class="wordmark display" href="/origicast/" aria-label="ORIGICAST"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="18" fill="none" stroke="#C9A961" stroke-width="4"/><circle cx="32" cy="32" r="6" fill="#C9A961"/></svg>{{ t.BRAND }}</a>
    <span class="age">{{ t.TAGLINE }}</span>
  </div>
</header>
<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>
<footer>
  <div class="wrap">
    {{ t.LEGAL_COMPANY }}
    <div class="legal">
      <a href="/impressum/">{{ t.LEGAL_IMPRINT }}</a>
      <a href="/agb/">{{ t.LEGAL_TERMS }}</a>
      <a href="/datenschutz/">{{ t.LEGAL_PRIVACY }}</a>
      <a href="mailto:{{ t.LEGAL_CONTACT }}">{{ t.LEGAL_CONTACT }}</a>
    </div>
  </div>
</footer>
</body>
</html>
