<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}X Autopilot{% endblock %} · startend.ch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M16 0H64V48H48V64H0V16H16Z' fill='%23DA291C'/%3E%3Crect x='26' y='12' width='12' height='40' fill='%23fff'/%3E%3Crect x='12' y='26' width='40' height='12' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>
<style>
  :root{ --paper:#EEF0EC; --card:#F7F8F5; --ink:#14181A; --ink-soft:#4A5250; --rule:#C9CDC6; --red:#E03123; --green:#1E7A46; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .mono{font-family:'IBM Plex Mono',monospace}
  .wrap{max-width:680px;margin:0 auto;padding:0 24px}
  header{border-bottom:1px solid var(--rule)}
  .head-in{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:12px}
  .wordmark{font-weight:800;letter-spacing:-0.02em;font-size:18px;text-decoration:none;color:var(--ink);display:flex;align-items:center}
  .wordmark span{color:var(--red)}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600}
  .pill-on{color:var(--green)} .pill-off{color:var(--ink-soft)}
  h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-0.03em;line-height:1.05;margin:40px 0 12px}
  .sub{color:var(--ink-soft);margin-bottom:28px}
  .card{border:1.5px solid var(--ink);border-radius:2px;background:var(--card);padding:28px;margin-bottom:20px}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:2px;font-weight:700;font-size:16px;border:1.5px solid var(--red);background:var(--red);color:#fff;cursor:pointer;font-family:'Archivo',sans-serif;text-decoration:none}
  .btn:hover{background:#C42417;border-color:#C42417}
  .btn-google{background:#fff;color:var(--ink);border-color:var(--ink)}
  .btn-google:hover{background:#fff;border-color:var(--ink)}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
  .err{border:1.5px solid var(--red);color:var(--red);padding:12px 14px;margin-bottom:20px;border-radius:2px;font-size:15px}
  .facts{list-style:none}
  .facts li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
  .facts li:last-child{border-bottom:none}
  .facts .k{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.05em;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
  th{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft)}
  footer{border-top:1px solid var(--rule);padding:24px 0 40px;font-size:13px;color:var(--ink-soft);margin-top:40px}
  footer a{color:var(--ink-soft)}
  .token{word-break:break-all;font-family:'IBM Plex Mono',monospace;font-size:12px;background:#fff;border:1px solid var(--rule);padding:12px;margin-top:12px}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="wrap head-in">
    <a class="wordmark" href="/x-autopilot/"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true" style="margin-right:8px"><path d="M16 0H64V48H48V64H0V16H16Z" fill="#DA291C"/><rect x="26" y="12" width="12" height="40" fill="#fff"/><rect x="12" y="26" width="40" height="12" fill="#fff"/></svg>startend<span>.ch</span></a>
    {% block header_meta %}{% endblock %}
  </div>
</header>
<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>
<footer>
  <div class="wrap">© 2026 STARTEND GmbH, Cham · <a href="/impressum/">Impressum</a> · <a href="mailto:info@startend.ch">info@startend.ch</a></div>
</footer>
</body>
</html>
