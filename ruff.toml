# Pin the rule set explicitly so `ruff check` means the same thing on every
# ruff version (CI installs the latest; defaults have widened between releases).
target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"alembic/versions/*.py" = ["E402"]
