<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>STARTEND — Agent Bus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M16 0H64V48H48V64H0V16H16Z' fill='%23DA291C'/%3E%3Crect x='26' y='12' width='12' height='40' fill='%23fff'/%3E%3Crect x='12' y='26' width='40' height='12' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#111114;
    --paper:#fff;
    --grey:#6B6B72;
    --line:#DCDCE2;
    --line-strong:#111114;
    --wash:#F6F5F2;
    --swiss:#DA291C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-weight:400;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 28px 80px}
  .display{font-family:'Didot','Bodoni MT','Didot LT STD',Georgia,'Times New Roman',serif;font-weight:400}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .label{font-size:10.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--grey)}

  header{border-bottom:2px solid var(--line-strong);padding:34px 0 22px}
  h1{font-size:clamp(30px,5vw,52px);line-height:1;letter-spacing:.01em;text-transform:uppercase}
  h1 span{color:var(--swiss)}
  .sub{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:baseline}
  .stat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}
  .stat b{color:var(--ink);font-weight:700}
  .dot{display:inline-block;width:7px;height:7px;background:var(--swiss);margin-right:7px;vertical-align:1px}

  section{border-top:1px solid var(--line);padding:34px 0 8px}
  section:first-of-type{border-top:0}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
  h2{font-size:23px;letter-spacing:.01em}
  h2 .tick{display:inline-block;width:9px;height:9px;background:var(--swiss);margin-right:11px}
  .count{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--grey)}

  .msg{border-top:1px solid var(--line);padding:15px 0;display:grid;grid-template-columns:200px 1fr;gap:6px 28px}
  .msg:first-child{border-top:1px solid var(--line-strong)}
  .msg .meta{display:flex;flex-direction:column;gap:4px}
  .msg .what{font-size:16.5px}
  .msg .next{margin-top:6px;font-size:14px;color:var(--grey)}
  .msg .next b{color:var(--ink);font-weight:600;letter-spacing:.14em;font-size:10.5px;text-transform:uppercase}
  .msg a{color:var(--swiss);text-decoration:none;border-bottom:1px solid rgba(218,41,28,.35);font-size:13.5px;word-break:break-all}
  .msg a:hover{border-bottom-color:var(--swiss)}
  .ts{font-size:11.5px;color:var(--grey)}
  .project{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

  .type{display:inline-block;align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.2em;
        text-transform:uppercase;padding:3px 8px;border:1px solid var(--ink);color:var(--ink)}
  .type.CLAIM,.type.ASK,.type.BLOCKED{border-color:var(--swiss);background:var(--swiss);color:#fff}
  .type.DONE,.type.DECISION{border-color:var(--ink);background:var(--ink);color:#fff}
  .type.SIGNAL{border-color:var(--line);color:var(--grey)}

  .teamblock{border-top:1px solid var(--line-strong);padding-top:6px;margin-top:26px}
  .teamblock:first-of-type{margin-top:0}
  .teamname{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;padding:10px 0}
  .teamname i{font-style:normal;color:var(--grey);font-weight:400}

  .empty{border-top:1px solid var(--line);padding:22px 0;color:var(--grey);font-size:15px}
  .error{border:1px solid var(--swiss);background:#FDF3F2;padding:16px 18px;margin:24px 0;font-size:14.5px}
  footer{border-top:2px solid var(--line-strong);margin-top:44px;padding:18px 0;
         display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:space-between}

  @media (max-width:720px){
    .msg{grid-template-columns:1fr;gap:8px}
    .msg .meta{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 class="display">Agent <span>Bus</span></h1>
    <div class="sub">
      <span class="stat"><span class="dot"></span>STARTEND AGENT BUS V0</span>
      <span class="stat">Messages <b id="s-total">—</b></span>
      <span class="stat">Retention <b id="s-retention">—</b></span>
      <span class="stat">Read <b id="s-generated">—</b></span>
      <span class="stat">Next refresh <b id="s-countdown">60s</b></span>
    </div>
  </header>

  <div id="error" class="error" hidden></div>

  <section>
    <div class="head">
      <h2 class="display"><span class="tick"></span>Open claims</h2>
      <span class="count" id="c-claims">—</span>
    </div>
    <div id="claims"></div>
  </section>

  <section>
    <div class="head">
      <h2 class="display"><span class="tick"></span>Waiting for Marcin</h2>
      <span class="count" id="c-asks">—</span>
    </div>
    <div id="asks"></div>
  </section>

  <section>
    <div class="head">
      <h2 class="display"><span class="tick"></span>Last 20 messages</h2>
      <span class="count" id="c-recent">—</span>
    </div>
    <div id="recent"></div>
  </section>

  <footer>
    <span class="label">One endpoint · one table · six message types</span>
    <span class="label">Auto-refresh 60s</span>
  </footer>

</div>

<script>
(function () {
  'use strict';

  // Filled in at boot by boot/views_boot.py from the BUS_STATE_URL variable.
  var STATE_URL = '__BUS_STATE_URL__';
  var REFRESH_SECONDS = 60;
  var TEAMS = ['CLAUDE_CLAUDECODE', 'GPT_CURSOR', 'GROK_MARKET'];

  var el = function (id) { return document.getElementById(id); };

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function shortTime(value) {
    var date = new Date(value);
    if (isNaN(date.getTime())) return escapeHtml(value);
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return date.getUTCFullYear() + '-' + pad(date.getUTCMonth() + 1) + '-' + pad(date.getUTCDate()) +
      ' ' + pad(date.getUTCHours()) + ':' + pad(date.getUTCMinutes()) + 'Z';
  }

  function messageHtml(message) {
    var type = String(message.type || '').toUpperCase();
    var safeType = /^[A-Z]+$/.test(type) ? type : '';
    var html = '<div class="msg">' +
      '<div class="meta">' +
        '<span class="type ' + safeType + '">' + escapeHtml(type) + '</span>' +
        '<span class="project mono">' + escapeHtml(message.project || '—') + '</span>' +
        '<span class="ts mono">' + shortTime(message.ts) + ' · ' + escapeHtml(message.team || '') + '</span>' +
      '</div>' +
      '<div><div class="what">' + escapeHtml(message.what || '') + '</div>';
    if (message.next) {
      html += '<div class="next"><b>Next</b> &nbsp;' + escapeHtml(message.next) + '</div>';
    }
    if (message.link) {
      html += '<div style="margin-top:6px"><a href="' + escapeHtml(message.link) + '" rel="noreferrer noopener" target="_blank">' +
        escapeHtml(message.link) + '</a></div>';
    }
    return html + '</div></div>';
  }

  function renderList(node, messages, emptyText) {
    if (!messages || !messages.length) {
      node.innerHTML = '<div class="empty">' + escapeHtml(emptyText) + '</div>';
      return;
    }
    node.innerHTML = messages.map(messageHtml).join('');
  }

  function renderRecent(node, state) {
    var grouped = state.recent_by_team || {};
    var names = TEAMS.filter(function (team) { return (grouped[team] || []).length; })
      .concat(Object.keys(grouped).filter(function (team) { return TEAMS.indexOf(team) === -1; }));

    if (!names.length) {
      node.innerHTML = '<div class="empty">Nothing on the bus yet.</div>';
      return;
    }
    node.innerHTML = names.map(function (team) {
      var messages = grouped[team] || [];
      return '<div class="teamblock">' +
        '<div class="teamname">' + escapeHtml(team) + ' <i>· ' + messages.length + '</i></div>' +
        messages.map(messageHtml).join('') +
        '</div>';
    }).join('');
  }

  function render(state) {
    el('error').hidden = true;
    el('s-total').textContent = (state.counts && state.counts.total != null) ? state.counts.total : '—';
    el('s-retention').textContent = state.retention != null ? state.retention : '—';
    el('s-generated').textContent = shortTime(state.generated_at);

    var claims = state.open_claims || [];
    var asks = state.open_asks || [];
    var recent = state.recent || [];
    el('c-claims').textContent = claims.length + (claims.length === 1 ? ' open' : ' open');
    el('c-asks').textContent = asks.length + ' waiting';
    el('c-recent').textContent = recent.length + ' shown';

    renderList(el('claims'), claims, 'No open claims — every claimed repo has been closed with a DONE.');
    renderList(el('asks'), asks, 'Nothing waiting for a decision.');
    renderRecent(el('recent'), state);
  }

  function showError(message) {
    var node = el('error');
    node.hidden = false;
    node.innerHTML = '<b>Bus state unavailable.</b> ' + escapeHtml(message) +
      ' &nbsp;Showing the last successful read; retrying in ' + REFRESH_SECONDS + 's.';
  }

  function load() {
    fetch(STATE_URL, { method: 'GET', cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('read-state returned HTTP ' + response.status);
        return response.json();
      })
      .then(function (state) {
        if (Array.isArray(state)) state = state[0] || {};
        render(state);
      })
      .catch(function (error) { showError(error && error.message ? error.message : String(error)); });
  }

  var remaining = REFRESH_SECONDS;
  setInterval(function () {
    remaining -= 1;
    if (remaining <= 0) { remaining = REFRESH_SECONDS; load(); }
    el('s-countdown').textContent = remaining + 's';
  }, 1000);

  load();
})();
</script>
</body>
</html>
